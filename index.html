<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Meine Routine</title>
<style>
body{margin:0;font-family:sans-serif;background:#fff4d6;padding:20px;text-align:center;}
h1{color:#333;margin-top:40px;}
.kid{display:inline-block;background:#ff9800;color:white;padding:20px 40px;margin:10px;border-radius:20px;font-size:24px;}
</style>
</head>
<body>
<h1>Meine Routine App 🚀</h1>
<div id="app">Lädt...</div>

<script>
const S = {
  kids: [
    {id:'k1', name:'Kind 1', avatar:'🦊'},
    {id:'k2', name:'Kind 2', avatar:'🐼'},
    {id:'k3', name:'Kind 3', avatar:'🦁'}
  ]
};

document.getElementById('app').innerHTML = 
  '<h2>Profile</h2>' + 
  S.kids.map(k => `<div class="kid">${k.avatar} ${k.name}</div>`).join('');
</script>
</body>
</html>
