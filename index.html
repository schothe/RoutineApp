<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Routine">
<title>Meine Routine</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#ff9800">
<!-- Supabase SDK laden -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;font-family:-apple-system,system-ui,Roboto,sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;border:0;padding:0;cursor:pointer}
.screen{min-height:100vh;min-height:100dvh;padding:calc(16px + env(safe-area-inset-top)) 20px 40px}
.home{background:#fff4d6}.day{background:#e8f7ff}.day.win{background:#fff1b8}.parent{background:#fff4d6}
.grid{display:flex;flex-wrap:wrap;gap:20px;justify-content:center}
.grid.left{justify-content:flex-start}
.kid{width:190px;height:200px;border-radius:40px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.kid .av{font-size:86px;line-height:1.1}.kid .nm{font-size:24px;font-weight:700}.kid .wk{font-size:18px;margin-top:4px;background:rgba(0,0,0,.2);border-radius:12px;padding:2px 10px}
.home .grid{margin-top:70px}
.lock{position:absolute;top:calc(12px + env(safe-area-inset-top));right:16px;width:52px;height:52px;border-radius:50%;background:#fff;font-size:24px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:8px;min-height:72px}
.homebtn{width:64px;height:64px;border-radius:50%;background:#fff;font-size:34px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.avs{font-size:52px}.stars{font-size:34px;line-height:1.1;flex:1}
.win .stars{font-size:46px}
.week{display:flex;gap:6px;background:#fff;border-radius:18px;padding:8px 10px;margin:4px 0 6px;align-items:center;flex-wrap:wrap}
.wd{width:44px;text-align:center;border-radius:12px;padding:2px 0}
.wd small{display:block;font-size:12px;color:#777}
.wd span{font-size:26px;line-height:1.25;color:#999}
.wd.today{background:#ffe082}
.trophy{margin-left:auto;font-size:24px;font-weight:700;padding-left:8px}
.part{font-size:56px;margin:18px 0 10px}
.tile{width:160px;height:160px;border:8px solid var(--c);border-radius:32px;background:#fff;position:relative;font-size:80px;line-height:1;transition:background .3s}
.tile.done{background:var(--c)}
.tile.done .ic{display:inline-block;transform:scale(1.15)}
.tile.pop .ic{display:inline-block;animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.6) rotate(-10deg)}100%{transform:scale(1.15)}}
.chk{position:absolute;top:2px;right:10px;font-size:34px;color:#fff}
.fly{position:fixed;left:50%;top:50%;font-size:44px;pointer-events:none;z-index:50;animation:fly 1.3s ease-out forwards}
@keyframes fly{from{transform:translate(-50%,-50%);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy));opacity:0}}
.bar{display:flex;align-items:center;gap:14px}
h1{font-size:24px;margin:0}h2{font-size:22px;margin:0}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 10px;flex-wrap:wrap}
.btn{background:#fff;border-radius:14px;padding:12px 16px;font-size:17px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.btn.pri{background:#ff9800;color:#fff}
.row{display:flex;align-items:center;background:#fff;border-radius:16px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.rowmain{flex:1;display:flex;align-items:center;gap:12px;padding:10px 14px;font-size:18px}
.rowmain small{color:#777;margin-left:auto;text-align:right}
.big{font-size:34px}
.del{background:none;font-size:26px;padding:14px 18px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.box{background:#fff;border-radius:22px;padding:22px;width:100%;max-width:520px;max-height:92vh;overflow:auto}
.box h2{margin-bottom:12px}
.box input[type=text],.box input[type=number]{width:100%;font-size:20px;padding:10px;border:2px solid #ddd;border-radius:10px;margin:6px 0 10px}
.lbl{font-size:14px;color:#777;margin:12px 0 4px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:32px;padding:6px 8px;border-radius:12px;background:#f3f3f3}
.pill{font-size:18px;padding:10px 14px;border-radius:12px;background:#eee}
.sel{background:#ffd54f!important}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.err{color:#d32f2f;min-height:20px}
</style>
</head>
<body>
<div id="app"></div>
<div id="fx"></div>
<script>
// ---------- Supabase Verbindung ----------
const SUPABASE_URL = 'https://ggnkegcsmfikuxjyddcy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_xoUpfy-H8iqX1uDPYVL7PQ_zRvd8J0f';
let supabase = null;
try {
  if(window.supabase) {
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }
} catch(e) {}

const AVATARS=['🐶','🐱','🐰','🦊','🐼','🦁','🐸','🐵','🦄','🐯'];
const ICONS=['🚽','👕','🪥','🍎','🎒','🚰','👟','📦','🛏️','🦷','📖','🧸','🧼','🍽️','🥣','🥛','🧦','🧥','🚿','🛁','🧹','🗑️','🎨','🌱','🐕'];
const PARTS=['🌅','☀️','🌙'];
const COLORS=['#ef5350','#26a69a','#ffb300','#7e57c2','#ec407a','#42a5f5'];
const DN=['So','Mo','Di','Mi','Do','Fr','Sa'];
const ORDER=[1,2,3,4,5,6,0];

function defaults(){
  return {
    kids:[
      {id:'k1',name:'Kind 1',age:6,avatar:'🦊'},
      {id:'k2',name:'Kind 2',age:3,avatar:'🐼'},
      {id:'k3',name:'Kind 3',age:3,avatar:'🦁'}
    ],
    cards:[
      {id:'c1',name:'Pipi machen',icon:'🚽',part:0,kid:null,ages:[],days:[],color:0},
      {id:'c2',name:'Anziehen',icon:'👕',part:0,kid:null,ages:[],days:[],color:1},
      {id:'c3',name:'Zähne putzen',icon:'🪥',part:0,kid:null,ages:[],days:[],color:2},
      {id:'c4',name:'Frühstücken',icon:'🍎',part:0,kid:null,ages:[],days:[],color:3},
      {id:'c5',name:'Kita-Tasche packen',icon:'🎒',part:0,kid:null,ages:[6],days:[1,2,3,4,5],color:4},
      {id:'c6',name:'Hände waschen',icon:'🚰',part:1,kid:null,ages:[],days:[],color:5},
      {id:'c7',name:'Schuhe & Jacke aufräumen',icon:'👟',part:1,kid:null,ages:[],days:[],color:0},
      {id:'c8',name:'Spielzeug aufräumen',icon:'📦',part:1,kid:null,ages:[],days:[],color:1},
      {id:'c9',name:'Schlafanzug anziehen',icon:'🛏️',part:2,kid:null,ages:[],days:[],color:2},
      {id:'c10',name:'Zähne putzen',icon:'🦷',part:2,kid:null,ages:[],days:[],color:3},
      {id:'c11',name:'Gute-Nacht-Geschichte',icon:'📖',part:2,kid:null,ages:[],days:[],color:4}
    ],
    done:[],day:today(),speak:true,goal:5,hist:{}
  };
}

function today(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();.replace()}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

// 1. Sofortiges Laden aus dem lokalen Speicher für blitzschnellen Start
function loadLocal(){
  let s=null;
  try{s=JSON.parse(localStorage.getItem('routine'));}catch(e){}
  if(!(s&&s.kids&&s.cards))s=defaults();
  s.cards.forEach(c=>{if(!c.ages)c.ages=[];if(!c.days)c.days=[];});
  if(!s.hist)s.hist={};
  if(!s.goal)s.goal=5;
  if(s.speak===undefined)s.speak=true;
  if(!s.done)s.done=[];
  if(!s.day)s.day=today();
  return s;
}

let S = loadLocal();
function saveLocal(){try{localStorage.setItem('routine',JSON.stringify(S));}catch(e){}}

// 2. Im Hintergrund Daten von Supabase laden und abgleichen
async function syncFromCloud(){
  if(!supabase) return;
  try {
    const { data: kidsData } = await supabase.from('kids').select('*');
    const { data: cardsData } = await supabase.from('tasks').select('*');
    const { data: statusData } = await supabase.from('daily_status').select('*').eq('date', today());

    if(kidsData && kidsData.length > 0) S.kids = kidsData;
    if(cardsData && cardsData.length > 0) {
      S.cards = cardsData.map(c => ({
        ...c,
        ages: c.ages || [],
        days: c.days || []
      }));
    }
    if(statusData) {
      S.done = statusData.filter(s => s.done).map(s => s.kid_id + '|' + s.task_id);
    }
    saveLocal();
    render();
  } catch(e) {
    console.error('Cloud-Sync im Hintergrund fehlgeschlagen', e);
  }
}

function checkDay(){
  if(S.day!==today()){
    S.day=today();S.done=[];
    const cut=ymd(new Date(Date.now()-70*864e5));
    Object.keys(S.hist).forEach(k=>{if(k<cut)delete S.hist[k];});
    saveLocal();
  }
}

const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=(k,c)=>k.id+'|'+c.id;
function cardsFor(k){
  const wd=new Date().getDay();
  return S.cards.filter(c=>(!c.kid||c.kid===k.id)&&(!c.ages.length||c.ages.includes(k.age))&&(!c.days.length||c.days.includes(wd)));
}
function who(c){if(!c.kid)return 'Alle';const k=S.kids.find(x=>x.id===c.kid);return k?k.avatar:'?';}
function daysText(days){
  if(!days.length)return '';
  const n=ORDER.filter(d=>days.includes(d));
  const s=n.join();
  if(s==='1,2,3,4,5')return 'Mo–Fr';
  if(s==='6,0')return 'Sa/So';
  return n.map(d=>DN[d]).join('/');
}

// ---------- Wochen-Belohnung ----------
function weekDates(){
  const d=new Date(),off=(d.getDay()+6)%7;
  const m=new Date(d.getFullYear(),d.getMonth(),d.getDate()-off);
  return [0,1,2,3,4,5,6].map(i=>new Date(m.getFullYear(),m.getMonth(),m.getDate()+i));
}
function weekStatus(k){
  const t=ymd(new Date());
  return weekDates().map(dt=>{
    const y=ymd(dt);
    if(y>t)return 'future';
    if(y===t){
      const cs=cardsFor(k),n=cs.filter(c=>S.done.includes(key(k,c))).length;
      if(!cs.length)return 'off';
      return n===cs.length?'perfect':n>0?'part':'none';
    }
    const h=(S.hist[y]||{})[k.id];
    return h?(h.all?'perfect':h.n>0?'part':'none'):'none';
  });
}
const weekPerfect=k=>weekStatus(k).filter(s=>s==='perfect').length;

let view={name:'home'},modal=null,justDone=null;
const $app=document.getElementById('app');

// ---------- Ton, Sprache, Vibration, Sterne ----------
let ac;
function chime(){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    [660,880,1100].forEach((f,i)=>{
      const o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';o.frequency.value=f;o.connect(g);g.connect(ac.destination);
      const t=ac.currentTime+i*0.1;
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.25,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.25);
      o.start(t);o.stop(t+0.3);
    });
  }catch(e){}
}
function say(text){
  if(!S.speak||!window.speechSynthesis)return;
  try{const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';u.rate=0.95;u.pitch=1.2;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}
}
function buzz(){if(navigator.vibrate)navigator.vibrate(40);}
function burst(n){
  const fx=document.getElementById('fx'),E=['⭐','🌟','✨','🎉','🏆'];
  const maxd=Math.min(innerWidth,innerHeight)/2;
  for(let i=0;i<n;i++){
    const s=document.createElement('span');s.className='fly';
    s.textContent=E[Math.floor(Math.random()*(n>60?5:4))];
    const a=Math.random()*Math.PI*2,d=100+Math.random()*maxd;
    s.style.setProperty('--dx',Math.cos(a)*d+'px');
    s.style.setProperty('--dy',(Math.sin(a)*d+60)+'px');
    fx.appendChild(s);setTimeout(()=>s.remove(),1400);
  }
}

// ---------- Ansichten ----------
function homeHTML(){
  return `<div class="screen home"><button class="lock" data-act="gate">🔒</button><div class="grid">`+
    S.kids.map((k,i)=>{
      const p=weekPerfect(k);
      return `<button class="kid" style="background:${COLORS[i\%6]}" data-act="kid" data-id="${k.id}"><span class="av">${k.avatar}</span><span class="nm">${esc(k.name)}</span><span class="wk">${p>=S.goal?'🏆':'⭐ '+p+'/'+S.goal}</span></button>`;
    }).join('')+
    `</div></div>`;
}
function tileHTML(k,c){
  const d=S.done.includes(key(k,c));
  return `<button class="tile ${d?'done':''}${justDone===c.id?'pop':''}" style="--c:${COLORS[c.color\%6]}" data-act="tile" data-id="${c.id}"><span class="ic">${c.icon}</span>${d?'<span class="chk">✔</span>':''}</button>`;
}
function dayHTML(){
  const k=S.kids.find(x=>x.id===view.kid);
  if(!k){view={name:'home'};return homeHTML();}
  const cs=cardsFor(k),n=cs.filter(c=>S.done.includes(key(k,c))).length,all=cs.length>0&&n===cs.length;
  const ws=weekStatus(k),dts=weekDates(),perfect=ws.filter(s=>s==='perfect').length,t=ymd(new Date());
  const sym={perfect:'⭐',part:'🔸',none:'○',off:'–',future:''};
  const week=`<div class="week">`+ws.map((s,i)=>`<div class="wd ${ymd(dts[i])===t?'today':''}"><small>${DN[(i+1)\%7]}</small><span>${sym[s]}</span></div>`).join('')+
    `<div class="trophy">${perfect>=S.goal?'🏆':'⭐ '+perfect+'/'+S.goal}</div></div>`;
  let body='';
  for(let p=0;p<3;p++){
    const l=cs.filter(c=>c.part===p);if(!l.length)continue;
    body+=`<div class="part">${PARTS[p]}</div><div class="grid left">${l.map(c=>tileHTML(k,c)).join('')}</div>`;
  }
  if(!cs.length)body='<p style="font-size:60px;text-align:center;margin-top:60px">😴</p>';
  return `<div class="screen day ${all?'win':''}"><div class="top"><button class="homebtn" data-act="home">🏠</button><span class="avs">${k.avatar}</span><span class="stars">${all?'🎉🏆🎉':'⭐'.repeat(n)}</span></div>${week}${body}
